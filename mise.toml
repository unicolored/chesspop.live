[tools]
"npm:@angular/cli" = "22"

[tasks.build]
description = "Build the app"
run = [
  "ng build --configuration production",
  "mv dist/app/browser/index.csr.html dist/app/browser/index.html",
]

[tasks.deploy]
description = "Deploy the app"
run = "wrangler pages deploy"

[env]
CODE_WORK_BRANCH = "develop"
CODE_UPSTREAM_BRANCH = "next"
RELEASE_VERSION = "2.1.0"

[tasks.release-checks]
run = [
  "pnpm run check-format",
  "pnpm run lint",
  "pnpm run test",
]

