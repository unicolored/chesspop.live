<div class="watch-layout">
  <aside class="watch-sidebar">
    <a class="watch-logo" routerLink="/">
      <svg lucidePopcorn class="h-6 w-6"></svg>
      ChessPop
    </a>

    <nav class="watch-channels" aria-label="Lichess channels">
      <p class="watch-label">Channels</p>
      @for (liveFeed of liveService.liveList; track liveFeed.url) {
        <button
          type="button"
          [class.active]="selectedFeed() === liveFeed.feed"
          (click)="selectedFeed.set(liveFeed.feed)">
          {{ liveFeed.platform }} - {{ liveFeed.type }}
        </button>
      }
    </nav>

    <nav class="watch-pages" aria-label="Pages">
      <p class="watch-label">Pages</p>
      <a routerLink="/about">About</a>
    </nav>
  </aside>

  <main class="watch-stage">
    <app-live-board [feed]="selectedFeed()" />
  </main>
</div>
