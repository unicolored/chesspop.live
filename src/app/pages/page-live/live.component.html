@defer {
  <div class="live-ui">
    <section class="chesspop-field">
      <app-live-board [feed]="selectedFeed()" (playersChange)="players.set($event)">
        <div board-overlay class="absolute top-2 right-2 z-10 flex items-center gap-2">
          <app-theme-toggle />
        </div>
      </app-live-board>

      <app-players [players]="players()" (emitCameraCol)="setCameraForPlayer($event)"></app-players>
    </section>

    <aside class="sidebar">
      <header>
        <p><small>Select a channel. Wait for next move.</small></p>
        <hr class="my-2" />
        @for (liveFeed of liveService.liveList; track liveFeed.url) {
          <button [class.active]="selectedFeed() === liveFeed.feed" (click)="selectedFeed.set(liveFeed.feed)">
            {{ liveFeed.platform }} - {{ liveFeed.type }}
          </button>
        }
      </header>

      <footer>
        <p>Use your mouse to drag the camera around.</p>
        <strong>Grab some pop 🍿 Enjoy the&nbsp;show!</strong>
      </footer>
    </aside>
  </div>
} @loading (minimum 1s; after 500ms) {
  <p>Loading ChessPop.</p>
} @error {
  <p>Failed to pop.</p>
}
