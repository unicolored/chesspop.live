<div class="chessfield-wrap" #chessfield>
  <ng-content select="[board-overlay]" />

  @switch (status()) {
    @case ('connecting') {
      <div class="cf-status" role="status" aria-live="polite">
        <span class="cf-spinner" aria-hidden="true"></span>
        <span>Connecting to {{ channelLabel() }}…</span>
      </div>
    }
    @case ('error') {
      <div class="cf-status cf-status-error" role="alert">
        <span>Couldn't reach {{ channelLabel() }}.</span>
        <button type="button" class="cf-retry" (click)="retry()">Retry</button>
      </div>
    }
  }
</div>
